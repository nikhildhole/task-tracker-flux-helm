## Configuration for the Kong API Gateway
kong:
  env:
    database: "off"

  proxy:
    type: LoadBalancer
    http:
      enabled: true
    loadBalancerIP: "192.168.49.100"

  ingressController:
    enabled: true
    ingressClass: kong
    admissionWebhook:
      enabled: false

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2

  resources:
    limits:
      cpu: 500m
      memory: 512Mi


## Configuration for the PostgreSQL database
postgresql:
  enabled: true
  auth:
    username: demousername
    password: demopassword
    database: demodb

  primary:
    persistence:
      existingClaim: postgres-data-pvc
