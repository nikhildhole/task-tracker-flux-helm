apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql
spec:
  releaseName: postgresql
  chartRef:
    kind: OCIRepository
    name: postgresql
    namespace: postgresql
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    postgresql:
      auth:
        database: taskdb
        username: postgres
        password: postgres