apiVersion: helm.toolkit.fluxcd.io/v2
kind: OCIRepository
metadata:
  name: postgresql
  namespace: postgresql
spec:
  releaseName: postgresql
  chart:
    spec:
      chart: postgresql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: bitnami
  interval: 50m
  install:
    remediation:
      retries: 3
  values:
    postgresql:
      auth:
        database: taskdb
        username: postgres
        password: postgres