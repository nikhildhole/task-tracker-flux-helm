{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "task-tracker-front-end.fullname" . }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "task-tracker-front-end.fullname" . }}

  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}

  resourcePolicy:
    containerPolicies:
      - containerName: {{ include "task-tracker-front-end.fullname" . }}
        minAllowed:
          cpu: {{ .Values.vpa.minAllowed.cpu }}
          memory: {{ .Values.vpa.minAllowed.memory }}
        maxAllowed:
          cpu: {{ .Values.vpa.maxAllowed.cpu | quote }}
          memory: {{ .Values.vpa.maxAllowed.memory }}
        controlledResources:
{{ toYaml .Values.vpa.controlledResources | indent 10 }}
{{- end }}
