{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "task-tracker-front-end.fullname" . }}
  labels:
    {{- include "task-tracker-front-end.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "task-tracker-front-end.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "task-tracker-front-end.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
