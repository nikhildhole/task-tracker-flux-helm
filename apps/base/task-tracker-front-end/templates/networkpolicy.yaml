apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-tracker-front-end.fullname" . }}
  labels:
    {{- include "task-tracker-front-end.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-tracker-front-end.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  # ✅ Ingress ONLY from Istio / Gateway
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

  # ✅ Egress ONLY for DNS (required)
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
