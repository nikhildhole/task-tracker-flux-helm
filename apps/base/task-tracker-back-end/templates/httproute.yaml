apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "task-tracker-back-end.fullname" . }}
spec:
  parentRefs:
  - name: external-gw
    namespace: istio-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /back-end
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ include "task-tracker-back-end.fullname" . }}
      port: {{ .Values.service.port }}