apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "task-tracker-back-end.fullname" . }}
spec:
  parentRefs:
  - name: external-gw
    namespace: istio-system
  hostnames:
  - back-end.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "task-tracker-back-end.fullname" . }}
      port: {{ .Values.service.port }}